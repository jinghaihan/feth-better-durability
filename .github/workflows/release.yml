name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: wuboyth/skyline-plugin-builder:latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag version
        run: |
          project_version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${project_version}"
          test "${cargo_version}" = "${project_version}"

      - name: Build Skyline plugin
        run: cargo skyline build --release

      - name: Prepare and verify NRO
        run: |
          cp \
            target/aarch64-skyline-switch/release/libfeth_better_durability.nro \
            feth-better-durability.nro
          python3 tools/verify_nro.py feth-better-durability.nro \
            --elf target/aarch64-skyline-switch/release/libfeth_better_durability.so

      - uses: actions/upload-artifact@v7
        with:
          name: feth-better-durability-release
          path: feth-better-durability.nro
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8
        with:
          name: feth-better-durability-release

      - name: Create installable package and checksums
        run: |
          project_version="$(tr -d '[:space:]' < VERSION)"
          package_root="package/atmosphere/contents/010055D009F78000/romfs/skyline/plugins"
          mkdir -p "${package_root}"
          cp feth-better-durability.nro "${package_root}/feth-better-durability.nro"
          (cd package && zip -r "../feth-better-durability-v${project_version}.zip" atmosphere)
          sha256sum \
            feth-better-durability.nro \
            "feth-better-durability-v${project_version}.zip" \
            > SHA256SUMS

      - name: Generate release notes
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release files
        run: |
          project_version="$(tr -d '[:space:]' < VERSION)"
          gh release upload "${GITHUB_REF_NAME}" \
            feth-better-durability.nro \
            "feth-better-durability-v${project_version}.zip" \
            SHA256SUMS \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloadable release files
        run: |
          project_version="$(tr -d '[:space:]' < VERSION)"
          mkdir release-download
          gh release download "${GITHUB_REF_NAME}" \
            --pattern feth-better-durability.nro \
            --pattern "feth-better-durability-v${project_version}.zip" \
            --dir release-download
          test -s release-download/feth-better-durability.nro
          test -s "release-download/feth-better-durability-v${project_version}.zip"
          expected_nro_sha="$(grep ' feth-better-durability.nro$' SHA256SUMS | cut -d ' ' -f 1)"
          actual_nro_sha="$(sha256sum release-download/feth-better-durability.nro | cut -d ' ' -f 1)"
          test "${actual_nro_sha}" = "${expected_nro_sha}"
          expected_zip_sha="$(grep " feth-better-durability-v${project_version}.zip$" SHA256SUMS | cut -d ' ' -f 1)"
          actual_zip_sha="$(sha256sum "release-download/feth-better-durability-v${project_version}.zip" | cut -d ' ' -f 1)"
          test "${actual_zip_sha}" = "${expected_zip_sha}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
